<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keril Priola — Multimedia &amp; Marketing</title>
<!-- Both faces from Fontshare (Indian Type Foundry), one request.
     Satoshi — Deni Anggara, the sans doing everything.
     Lora — Cyreal, upright, for the quieter sub copy.
     Weight 400 only, matching the reference's single-weight rule. -->
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400&f[]=lora@400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   RULES: all text is Sand. Gradients use Forest / Moss / Sand only.
          Ember is a solid accent — never in a gradient.
   ============================================================ */
:root{
  --color-forest:#40513B;
  --color-moss:#628141;
  --color-sand:#E5D9B6;
  --color-ember:#E67E22;
  --color-deep:#33412F;

  --grad-primary:linear-gradient(135deg, var(--color-forest) 0%, var(--color-moss) 100%);

  --font-primary:'Satoshi', 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-accent:'Lora', ui-serif, Georgia, "Times New Roman", serif;

  --text-display:72px;
  --leading-display:1;
  --text-body:24px;
  --leading-body:1.2;

  --spacing-7:7px;  --spacing-8:8px;  --spacing-10:10px;
  --spacing-12:12px;--spacing-13:13px;--spacing-20:20px;--spacing-29:29px;
  --ctl-pad:var(--spacing-29);   /* left column padding — rules cancel it */
  --split:50%;                   /* column split — the curtain follows it */

  --radius-full:120px;
  --section-gap:15px;   /* rhythm between sections */
  --footer-h:58px;
  --stroke:1px;        /* hairlines: pill borders, tile edges */
  --divider:2px;       /* structural dividers: rules, column split, footer */
  --pill-stroke:2px;   /* pill outlines */
  --dim:.68;

  /* Slow, then quick, then slow — cubic-bezier(0.42, 0, 0.58, 1) is the
     canonical ease-in-out curve. One token so every motion matches. */
  --ease:cubic-bezier(0.42, 0, 0.58, 1);
  --dur:1s;
  --dur-fast:.22s;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--color-forest);
  color:var(--color-sand);
  font-family:var(--font-primary);
  font-weight:400;
  font-size:var(--text-body);
  line-height:var(--leading-body);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(120% 90% at 8% 105%, rgba(98,129,65,.32) 0%, rgba(98,129,65,0) 60%),
    radial-gradient(90% 70% at 100% 0%, rgba(98,129,65,.22) 0%, rgba(98,129,65,0) 60%);
}
h1,h2,h3,p,figure{margin:0;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
::selection{background:var(--color-ember);color:var(--color-sand);}
:focus-visible{outline:2px solid var(--color-ember);outline-offset:4px;}

/* ============================================================
   SPLIT STAGE
   ============================================================ */
.split{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:var(--split) calc(100% - var(--split));
  height:calc(100vh - var(--footer-h));
  height:calc(100dvh - var(--footer-h));
}
.column{overflow-y:auto;scrollbar-width:none;}
.column::-webkit-scrollbar{display:none;}
.control{
  padding:var(--ctl-pad) var(--ctl-pad) 80px;
  border-right:var(--divider) solid var(--color-sand);
}
.index{padding:0;background:linear-gradient(180deg, rgba(51,65,47,.55) 0%, rgba(51,65,47,0) 40%);}

/* ============================================================
   TYPE
   ============================================================ */
.display{
  font-family:var(--font-primary);
  font-size:clamp(40px, 5.2vw, var(--text-display));
  line-height:var(--leading-display);
  font-weight:400;
  letter-spacing:normal;
  color:var(--color-sand);
}
.body{font-size:var(--text-body);line-height:var(--leading-body);max-width:42ch;color:var(--color-sand);}
.serif{
  font-family:var(--font-accent);
  font-style:normal;
  font-size:var(--text-body);
  line-height:var(--leading-body);
  color:var(--color-sand);
  opacity:var(--dim);
}

.rule{
  border:0;
  height:var(--divider);
  background:var(--color-sand);
  /* Full bleed: widen by the column padding and pull back by the same, so the
     bar runs edge to edge instead of floating inside the text margin. */
  width:calc(100% + (var(--ctl-pad) * 2));
  margin:var(--section-gap) calc(var(--ctl-pad) * -1);
}

/* ============================================================
   PILLS
   ============================================================ */
.pill{
  display:inline-flex;
  align-items:center;
  gap:var(--spacing-8);
  border-radius:var(--radius-full);
  font-family:var(--font-primary);
  border:var(--pill-stroke) solid var(--color-sand);
  background:transparent;
  color:var(--color-sand);
  padding:var(--spacing-10) var(--spacing-13);
  font-size:var(--text-body);
  line-height:1;
  white-space:nowrap;
  transition:border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
}
.pill:hover{border-color:var(--color-ember);}
.pill--active,
.pill--active:hover{
  background:var(--color-ember);
  border-color:var(--color-ember);
  color:var(--color-sand);
}
.pill--empty{opacity:.35;}
.pill--icon{width:44px;height:44px;padding:0;justify-content:center;flex:0 0 auto;}
/* The toggle ignores presses while an animation is running, so it can never
   be cut short. No dimming and no cooldown — the button looks and behaves
   normally, extra presses simply do nothing until the motion finishes. */

.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--spacing-20);}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--spacing-13);
  /* No bottom margin. The collapsible block below owns the spacing, so a
     collapsed section measures exactly the same as one with nothing under it. */
  margin-bottom:0;
}
/* A section whose full version lives on another page shows a '+' that goes
   there. A section that expands in place shows the '−' collapse toggle. */
.pillrow{display:flex;flex-wrap:wrap;gap:var(--spacing-7);}

/* Email copies to the clipboard. Fixed width so swapping the label to
   COPIED does not make the pill jump. */
.pill--copy{min-width:8.5ch;justify-content:center;cursor:pointer;}
.visually-hidden{
  position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;
}

/* Contact, grouped one field per line */
.contact-group{margin-top:var(--spacing-29);}
.contact-group + .contact-group{margin-top:var(--spacing-20);}
.contact-group .where{opacity:var(--dim);}
.contact-group a:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--color-ember);}

/* ---------- Collapsible ----------
   Height is animated from script with the Web Animations API, not with a CSS
   transition. A CSS transition can be switched off entirely by the OS reduced
   motion setting; this cannot, so the section always animates. */
.collapsible{overflow:hidden;}
.collapsible-inner{padding-top:var(--spacing-29);}
.collapsible[data-collapsed="true"]{height:0;}

.filters{display:flex;flex-wrap:wrap;gap:var(--spacing-7) var(--spacing-7);}
.filters .pill{cursor:pointer;}

/* ============================================================
   VISUAL INDEX
   ============================================================ */
.thumb{
  position:relative;
  display:block;
  width:100%;
  /* Set per piece from its real dimensions. 3/2 is only the fallback for
     older entries that predate aspect capture. */
  aspect-ratio:var(--ar, 3/2);
  border-radius:0;
  overflow:hidden;
  border:0;
  /* A bar above every tile, and one after the last, so each piece is closed
     top and bottom. Adjacent tiles share a bar rather than stacking two.
     Same weight and colour as the rules in the left column, and flush
     against the image — no margin to open a gap. */
  border-top:var(--divider) solid var(--color-sand);
  cursor:pointer;
  text-align:left;
}
.thumb.is-hidden{display:none;}
/* Square and portrait — half width, two to a row */

.thumb .canvas{
  display:block;width:100%;height:100%;
  /* contain, not cover — nothing gets cropped. When the tile's ratio matches
     the artwork the two are identical anyway, so there's no letterboxing. */
  object-fit:contain;
  transition:opacity var(--dur) var(--ease);
  background:var(--color-deep);
}

.thumb::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(115deg, rgba(64,81,59,.88) 0%, rgba(98,129,65,.60) 55%, rgba(229,217,182,.30) 100%);
  opacity:0;transition:opacity var(--dur) var(--ease);pointer-events:none;
}
.thumb:hover::after,.thumb:focus-visible::after{opacity:1;}
/* Title and page count share one row across the top of the tile. The title
   shrinks and truncates; the count never does. They cannot collide. */
.thumb-bar{
  position:absolute;
  top:var(--spacing-20);
  left:var(--spacing-20);
  right:var(--spacing-20);
  z-index:2;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:var(--spacing-7);
  pointer-events:none;
}
.thumb-bar .pill{
  background:rgba(64,81,59,.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.thumb-label{min-width:0;}          /* lets it shrink instead of pushing out */
.thumb-label span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.thumb-pages{flex:0 0 auto;}        /* never squeezed */
.thumb:hover .thumb-bar .pill{background:var(--color-ember);border-color:var(--color-ember);}
/* Play marker — only on items that actually play */
.thumb-play{
  position:absolute;right:var(--spacing-20);bottom:var(--spacing-20);z-index:2;
  width:56px;height:56px;border-radius:var(--radius-full);
  border:var(--pill-stroke) solid var(--color-sand);
  background:rgba(64,81,59,.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
}
.thumb-play svg{width:18px;height:18px;fill:var(--color-sand);margin-left:3px;}
.thumb:hover .thumb-play{background:var(--color-ember);border-color:var(--color-ember);}

.index-end{
  padding:var(--spacing-29);
  font-size:var(--text-body);
  color:var(--color-sand);
  opacity:var(--dim);
  border-top:var(--divider) solid var(--color-sand);   /* closes the last tile */
}
.index-empty{padding:var(--spacing-29);max-width:40ch;}
.index-empty .serif{margin-top:var(--spacing-12);display:block;}

/* ============================================================
   LIGHTBOX
   ============================================================ */
.lightbox{
  position:fixed;inset:0;z-index:50;
  display:none;
  align-items:center;justify-content:center;
  padding:var(--spacing-29);
  /* Opaque on purpose. A backdrop-filter here re-blurs the whole screen on every
     frame of video playback, which is what drags the framerate down. */
  background:#222B1C;
}
.lightbox[data-open="true"]{display:flex;}
.lightbox-inner{
  width:min(1600px,100%);
  max-height:100%;
  display:flex;flex-direction:column;gap:var(--spacing-20);
}
/* Keep the 16:9 stage as large as the window allows — YouTube picks its
   streaming quality partly from the player's rendered size. */
.lightbox-stage{max-height:calc(100vh - 200px);margin-inline:auto;width:100%;}
.lightbox-stage{
  position:relative;width:100%;aspect-ratio:var(--ar, 16/9);
  background:#000;border:var(--stroke) solid rgba(229,217,182,.45);
}
.lightbox-stage > *{position:absolute;inset:0;width:100%;height:100%;border:0;}
.lightbox-stage img{object-fit:contain;}
.lightbox-stage video{object-fit:contain;background:#000;}
.lightbox-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-13);flex-wrap:wrap;}
.lightbox-meta{display:flex;flex-direction:column;gap:6px;min-width:0;}
.lightbox-title{font-size:var(--text-body);}
.lightbox-sub{font-size:var(--text-body);opacity:var(--dim);}
.lightbox-nav{display:flex;gap:var(--spacing-7);}
.lightbox-dots{display:flex;gap:8px;align-items:center;}
.dot{
  width:9px;height:9px;padding:0;border-radius:var(--radius-full);
  border:1px solid var(--color-sand);background:transparent;cursor:pointer;
  transition:background-color var(--dur-fast) var(--ease);
}
.dot.on{background:var(--color-ember);border-color:var(--color-ember);}
.dot:hover{border-color:var(--color-ember);}
/* Page count marker on a multi-slide tile */



/* ---------- Page curtain ----------
   A pane of Forest over the right column only. Opaque on arrival, fades out
   to reveal the content, and fades back in before the page changes. Stops
   above the footer bar so the info strip is never half-covered. */
.curtain{
  position:fixed;
  top:0;
  bottom:var(--footer-h);
  left:var(--split);             /* follows the column split */
  right:0;
  z-index:40;                    /* over the content, under the lightbox */
  background:var(--color-forest);
  opacity:1;
  pointer-events:none;           /* never intercepts a click, even if stuck */
}
@media (max-width:1000px){
  /* stacked layout — there is no right column to isolate */
  .curtain{left:0;}
}

/* ============================================================
   FOOTER
   ============================================================ */
.infobar{
  position:fixed;left:0;right:0;bottom:0;z-index:2;
  height:var(--footer-h);
  display:flex;align-items:center;gap:var(--spacing-12);
  padding:0 var(--spacing-29);
  background:var(--color-deep);
  color:var(--color-sand);
  font-size:var(--text-body);
  line-height:1;white-space:nowrap;overflow-x:auto;scrollbar-width:none;
}
.infobar::before{content:"";position:absolute;top:0;left:0;right:0;height:var(--divider);background:var(--color-sand);}
.infobar::-webkit-scrollbar{display:none;}
.infobar .sep,.infobar .quiet{opacity:var(--dim);}
.infobar a:hover{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--color-ember);}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1000px){
  :root{--text-body:20px;--section-gap:12px;--footer-h:52px;}
  body{overflow:auto;}
  .split{display:block;height:auto;}
  .column{overflow:visible;}
  .control{border-right:0;border-bottom:var(--divider) solid var(--color-sand);--ctl-pad:var(--spacing-20);padding:var(--ctl-pad);}
  .index{padding-bottom:calc(var(--footer-h) + var(--spacing-20));}
  .masthead{flex-direction:column;gap:var(--spacing-20);}
  .pill--icon{width:38px;height:38px;}
  .thumb-play{width:44px;height:44px;}
  /* overlay pills shrink so a long title keeps most of the row */
  .thumb-bar{top:var(--spacing-12);left:var(--spacing-12);right:var(--spacing-12);}
  .thumb-bar .pill{font-size:15px;padding:7px 11px;}
  .lightbox{padding:var(--spacing-20);}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>

<main class="split">

  <!-- ========== LEFT: CONTROL COLUMN ========== -->
  <section class="column control">

    <div class="masthead">
      <h1 class="display">Keril&nbsp;Priola</h1>
    </div>

    <hr class="rule">

    <div class="section-head">
      <h2 class="display" id="work">Work</h2>
      <button class="pill pill--icon" id="collapse" aria-expanded="false" aria-controls="workBox" aria-label="Expand work" title="Expand">+</button>
    </div>

    <div class="collapsible" id="workBox" data-collapsed="true">
      <div class="collapsible-inner"><div class="filters" id="filters" role="group" aria-labelledby="work"></div></div>
    </div>

    <hr class="rule">

         aria-label="Open the info page" title="Open the info page">+</a>
    </div>



    <hr class="rule">

    <h2 class="display">Contact</h2>

    <div class="contact-group">
      <div>Keril Priola</div>
      <div class="where">Laguna, Philippines</div>
      <div class="where">Multimedia &amp; Marketing</div>
    </div>

    <div class="pillrow" style="margin-top:var(--spacing-29)">
      <button class="pill pill--copy" id="copyEmail"
              data-email="priolakerilm@gmail.com"
              aria-label="Copy email address">Email</button>
      <a class="pill" href="https://www.linkedin.com/in/hello-its-kp/"
         target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </div>
    <span class="visually-hidden" id="copyStatus" role="status" aria-live="polite"></span>

  </section>

  <!-- ========== RIGHT: VISUAL INDEX (rendered from works.json) ========== -->
  <section class="column index" id="index" aria-label="Work index"></section>
</main>

<!-- ========== LIGHTBOX ========== -->
<div class="lightbox" id="lightbox" data-open="false" role="dialog" aria-modal="true" aria-label="Work viewer">
  <div class="lightbox-inner">
    <div class="lightbox-stage" id="stage"></div>
    <div class="lightbox-bar">
      <div class="lightbox-meta">
        <span class="lightbox-title" id="lbTitle"></span>
        <span class="lightbox-sub" id="lbSub"></span>

        <button class="pill" id="lbPrev">Previous</button>

</div>

<div class="curtain" id="curtain" aria-hidden="true"></div>

<footer class="infobar">
  <span>Manila 31&deg;</span><span class="sep">|</span>
  <span>Keril Priola</span><span class="sep">|</span>
  <span class="quiet">Multimedia &amp; Marketing</span><span class="sep">|</span>
  <a href="mailto:priolakerilm@gmail.com">priolakerilm@gmail.com</a>
</footer>

<script>
/* ============================================================
   CATEGORIES — the single source of truth.
   admin.html reads this same list. Edit here, edit there too.
   ============================================================ */
const CATEGORIES = [
  { id:'all',           label:'Selected'        },
  { id:'graphics',      label:'Graphics'        },
  { id:'video',         label:'Video'           },
  { id:'branding',      label:'Branding'        },
  { id:'motion',        label:'Motion Graphics' },
  { id:'shortfilm',     label:'Short Film'      },
  { id:'music',         label:'Music'           },
  { id:'sfx',           label:'SFX'             },
  { id:'presentations', label:'Presentations'   },
  { id:'podcast',       label:'Podcast'         }
];

const PLAYABLE = ['youtube','vimeo','video'];

/* Aspect = width / height. Clamped so one extreme piece can't swallow the
   column: nothing narrower than 2:3 portrait or wider than 21:9. */
const AR_MIN = 0.66, AR_MAX = 2.4;
/* Every tile is full width and keeps the artwork's own proportions.
   Called once from the manifest hint, then again when the image actually
   loads — so pieces added before the studio measured anything still get
   the right height instead of guessing 3:2. */
function applyShape(btn, ar){
  if(!ar || !isFinite(ar)) return;
  btn.style.setProperty('--ar', String(Math.min(AR_MAX, Math.max(AR_MIN, ar))));
}
function clampAR(a, type){
  const n = Number(a);
  if(!n || !isFinite(n)) return PLAYABLE.includes(type) ? 16/9 : 3/2;
  return Math.min(AR_MAX, Math.max(AR_MIN, n));
}

/* A piece is always a list of slides. Single-image entries become a list of
   one, so nothing downstream needs to care which it is. */
function slidesOf(w){
  if(Array.isArray(w.slides) && w.slides.length){
    return w.slides.map(sl => ({
      type: sl.type || 'image',
      src: sl.src,
      poster: sl.poster,
      aspect: clampAR(sl.aspect, sl.type || 'image')
    }));
  }
  return [{ type:w.type, src:w.src, poster:w.poster, aspect:clampAR(w.aspect, w.type) }];
}

/* Folder holding posters and self-hosted video.
   Must match MEDIA_DIR in admin.html, and must match the real folder name
   exactly — Vercel's servers are case-sensitive, so Assets != assets. */
const MEDIA_DIR = 'Assets';

let WORKS = [];
let visible = [];
let activeFilter = 'all';
let lastFocus = null;

const $index   = document.getElementById('index');
const $filters = document.getElementById('filters');

/* ---------- Load the manifest ---------- */
async function load(){
  try{
    const res = await fetch('works.json', { cache:'no-store' });
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    WORKS = (data.works || []).slice().sort((a,b)=>(a.order??999)-(b.order??999));
    WORKS.forEach(w => { w._slides = slidesOf(w); });
    renderFilters();
    apply('all', true);
  }catch(err){
    $index.innerHTML =
      '<div class="index-empty">' +
      '<p class="body">The work manifest did not load.</p>' +
      '<span class="serif">If you opened this file directly, run a local server instead &mdash; ' +
      'fetch is blocked on file:// URLs. Try <b>npx serve</b> or ' +
      '<b>python3 -m http.server</b> in this folder.</span></div>';
    renderFilters();
  }
}

/* ---------- Filters ---------- */
function countFor(id){
  return id === 'all' ? WORKS.length
    : WORKS.filter(w => (w.categories||[]).includes(id)).length;
}

function renderFilters(){
  $filters.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const n = countFor(cat.id);
    const b = document.createElement('button');
    b.className = 'pill' + (cat.id === activeFilter ? ' pill--active' : '') + (n ? '' : ' pill--empty');
    b.dataset.filter = cat.id;
    b.setAttribute('aria-pressed', String(cat.id === activeFilter));
    b.textContent = cat.label;
    b.addEventListener('click', () => apply(cat.id));
    $filters.appendChild(b);
  });
}

/* Every slide of every visible piece, in order — so Previous/Next walks
   through pages inside a piece and then rolls on to the next piece. */
let reel = [];
function buildReel(){
  reel = [];
  visible.forEach((w, wi) => {
    w._slides.forEach((sl, si) => reel.push({ w, sl, wi, si, of: w._slides.length }));
  });
}

let filterAnim = null;

/* Switching category crossfades the index: out, swap the tiles while nothing
   is visible, back in. Half the shared duration each way, so the whole
   exchange takes the same time as every other motion on the site. */
function apply(id, instant){
  if(id === activeFilter && !instant) return;      // already showing it
  activeFilter = id;

  $filters.querySelectorAll('[data-filter]').forEach(p => {
    const on = p.dataset.filter === id;
    p.classList.toggle('pill--active', on);
    p.setAttribute('aria-pressed', String(on));
  });

  const swap = () => {
    visible = id === 'all' ? WORKS : WORKS.filter(w => (w.categories||[]).includes(id));
    buildReel();
    renderIndex();
    $index.scrollTop = 0;
  };

  if(instant || !$index.animate){ swap(); return; }

  const half = { duration: MOTION.duration / 2, easing: MOTION.easing };
  if(filterAnim) filterAnim.cancel();

  filterAnim = $index.animate([{opacity:1},{opacity:0}], half);
  filterAnim.onfinish = () => {
    $index.style.opacity = '0';                    // hold it hidden across the swap
    swap();
    filterAnim = $index.animate([{opacity:0},{opacity:1}], half);
    filterAnim.onfinish = () => { $index.style.opacity = ''; filterAnim = null; };
  };
}

/* ---------- Index ---------- */
function renderIndex(){
  if(!visible.length){
    const label = (CATEGORIES.find(c => c.id === activeFilter) || {}).label || 'this category';
    $index.innerHTML =
      '<div class="index-empty"><p class="body">Nothing filed under ' + label + ' yet.</p>' +
      '<span class="serif">Add a piece in admin.html, re-export works.json, and it will appear here.</span></div>';
    return;
  }
  $index.innerHTML = '';
  visible.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'thumb';
    btn.type = 'button';
    const first = w._slides[0];
    applyShape(btn, first.aspect);          // hint from the manifest, to avoid a jump
    btn.setAttribute('aria-label', 'Open ' + w.title);

    const img = document.createElement('img');
    img.className = 'canvas';
    img.loading = 'lazy';
    img.alt = w.alt || w.title || '';
    img.src = first.poster || (first.type === 'youtube' ? posterFor(w) : first.src) || posterFor(w);
    if(!first.poster && first.type === 'youtube'){
      let step = 0;
      img.onerror = () => {
        if(++step < YT_SIZES.length) img.src = ytThumb(w.src, step);
        else { img.onerror = null; img.src = MEDIA_DIR + '/placeholder.svg'; }
      };
    }
    /* The image itself is the source of truth */
    img.addEventListener('load', () => {
      if(img.naturalWidth && img.naturalHeight)
        applyShape(btn, img.naturalWidth / img.naturalHeight);
    });
    btn.appendChild(img);

    const bar = document.createElement('div');
    bar.className = 'thumb-bar';

    const label = document.createElement('span');
    label.className = 'pill thumb-label';
    const labelText = document.createElement('span');
    labelText.textContent = (w.kind ? w.kind + ' — ' : '') + w.title;
    label.appendChild(labelText);
    label.title = labelText.textContent;      /* full text on hover if truncated */
    bar.appendChild(label);
    btn.appendChild(bar);

    if(PLAYABLE.includes(first.type)){
      const play = document.createElement('span');
      play.className = 'thumb-play';
      play.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l16 9-16 9z"/></svg>';
      btn.appendChild(play);
    }
    if(w._slides.length > 1){
      const pages = document.createElement('span');
      pages.className = 'pill thumb-pages';
      pages.textContent = w._slides.length + ' pages';
      bar.appendChild(pages);
    }

    btn.addEventListener('click', () => open(reel.findIndex(r => r.wi === i)));
    $index.appendChild(btn);
  });

  const end = document.createElement('p');
  end.className = 'index-end';
  end.textContent = 'End of index — ' + visible.length +
    (visible.length === 1 ? ' piece' : ' pieces') + ' shown.';
  $index.appendChild(end);
}

/* YouTube gives us a free poster if none was exported */
function posterFor(w){
  if(w.type === 'youtube' && w.src) return ytThumb(w.src, 0);
  return MEDIA_DIR + '/placeholder.svg';
}

/* Not every upload has a maxres still, so walk down the sizes until one loads.
   maxres 1280x720 -> sd 640x480 -> hq 480x360 */
const YT_SIZES = ['maxresdefault','sddefault','hqdefault'];
function ytThumb(id, step){
  return 'https://i.ytimg.com/vi/' + id + '/' + YT_SIZES[step] + '.jpg';
}

/* ---------- Lightbox ---------- */
const $lb = document.getElementById('lightbox');
const $stage = document.getElementById('stage');
let current = -1;

let lbAnim = null;
let lbClosing = false;

function open(i){
  if(i < 0 || !reel.length) return;
  current = i;
  const wasShut = $lb.dataset.open !== 'true';
  if(wasShut) lastFocus = document.activeElement;
  const { w, sl, si, of } = reel[i];

  $stage.style.setProperty('--ar', String(sl.aspect));
  $stage.innerHTML = embed(sl, w);

  document.getElementById('lbTitle').textContent = (w.kind ? w.kind + ' — ' : '') + w.title;
  document.getElementById('lbSub').textContent = [
    of > 1 ? 'Page ' + (si + 1) + ' of ' + of : '',
    w.year,
    (w.categories||[]).map(labelOf).join(', ')
  ].filter(Boolean).join('  ·  ');

  renderDots(w, si, i);
  $lb.dataset.open = 'true';

  /* Fade in only when the viewer is appearing — not when paging between
     slides, where the frame is already on screen. */
  if(wasShut){
    lbClosing = false;
    if(lbAnim) lbAnim.cancel();
    $lb.style.opacity = '0';
    lbAnim = $lb.animate([{opacity:0},{opacity:1}], MOTION);
    lbAnim.onfinish = () => { $lb.style.opacity = ''; lbAnim = null; };
  }
  document.getElementById('lbClose').focus();
}

/* Page markers, only when a piece actually has pages */
function renderDots(w, si, reelIndex){
  const box = document.getElementById('lbDots');
  box.innerHTML = '';
  if(w._slides.length < 2) return;
  w._slides.forEach((_, k) => {
    const d = document.createElement('button');
    d.className = 'dot' + (k === si ? ' on' : '');
    d.type = 'button';
    d.setAttribute('aria-label', 'Page ' + (k + 1));
    d.onclick = () => open(reelIndex - si + k);
    box.appendChild(d);
  });
}

function embed(sl, w){
  if(sl.type === 'youtube')
    return '<iframe src="https://www.youtube.com/embed/' + sl.src +
           '?autoplay=1&rel=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
  if(sl.type === 'vimeo')
    return '<iframe src="https://player.vimeo.com/video/' + sl.src +
           '?autoplay=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
  if(sl.type === 'video')
    return '<video src="' + sl.src + '" controls autoplay playsinline preload="metadata"' +
           (sl.poster ? ' poster="' + sl.poster + '"' : '') + '></video>';
  return '<img src="' + (sl.src || sl.poster) + '" alt="' + (w.title || '') + '">';
}

function labelOf(id){
  const c = CATEGORIES.find(c => c.id === id);
  return c ? c.label : id;
}

function close(){
  if(lbClosing) return;            // already on its way out
  lbClosing = true;
  if(lbAnim) lbAnim.cancel();

  const done = () => {
    $lb.dataset.open = 'false';
    $lb.style.opacity = '';
    $stage.innerHTML = '';         // stops playback
    lbAnim = null;
    lbClosing = false;
    if(lastFocus) lastFocus.focus();
  };

  if(!$lb.animate) return done();  // no animation support — just shut
  lbAnim = $lb.animate([{opacity:1},{opacity:0}], MOTION);
  lbAnim.onfinish = done;
  lbAnim.oncancel = done;
}
function step(d){
  if(!reel.length || lbClosing) return;
  open((current + d + reel.length) % reel.length);
}

/* Swipe through pages on touch */
let tx = 0, ty = 0;
$stage.addEventListener('touchstart', e => {
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
}, { passive:true });
$stage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
}, { passive:true });

document.getElementById('lbClose').addEventListener('click', close);
document.getElementById('lbPrev').addEventListener('click', () => step(-1));
document.getElementById('lbNext').addEventListener('click', () => step(1));
$lb.addEventListener('click', e => { if(e.target === $lb) close(); });
document.addEventListener('keydown', e => {
  if($lb.dataset.open !== 'true' || lbClosing) return;
  if(e.key === 'Escape') close();
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === 'ArrowRight') step(1);
});



/* ---------- Collapse / expand ----------
   One second, ease-in-out, driven by element.animate(). */
const MOTION = { duration: 500, easing: 'cubic-bezier(0.42, 0, 0.58, 1)' };

function toggleCollapsible(box, open){
  const inner = box.firstElementChild;
  const from = box.getBoundingClientRect().height;
  box.style.height = from + 'px';
  box.dataset.collapsed = String(!open);

  /* measure the natural height with the box temporarily unconstrained */
  box.style.height = 'auto';
  const full = box.getBoundingClientRect().height;
  box.style.height = from + 'px';

  const to = open ? full : 0;

  box._anim = box.animate(
    [{ height: from + 'px', opacity: open ? 0 : 1 },
     { height: to   + 'px', opacity: open ? 1 : 0 }],
    MOTION
  );
  box._anim.onfinish = () => {
    box.style.height = open ? 'auto' : '0px';
    box.style.opacity = '';
    box._anim = null;
  };
}

function initCollapsible(box){
  box.style.height = box.dataset.collapsed === 'true' ? '0px' : 'auto';
}

/* ---------- Work collapse toggle ---------- */
const workBox = document.getElementById('workBox');
const toggle = document.getElementById('collapse');
initCollapsible(workBox);

let workLocked = false;

function paintToggle(open){
  toggle.setAttribute('aria-expanded', String(open));
  toggle.innerHTML = open ? '&#8722;' : '+';
  toggle.setAttribute('aria-label', open ? 'Collapse work' : 'Expand work');
  toggle.setAttribute('title', open ? 'Collapse' : 'Expand');
}

function setWork(open){
  if(workLocked) return;
  if(open === (workBox.dataset.collapsed === 'false')) return;   // already there
  workLocked = true;
  toggleCollapsible(workBox, open);
  paintToggle(open);
  /* released the moment the animation finishes */
  setTimeout(() => { workLocked = false; }, MOTION.duration);
}
toggle.addEventListener('click', () => setWork(workBox.dataset.collapsed === 'true'));

/* ---------- Close before leaving ----------
   An open section shuts itself before the page changes, so the next page is
   never entered with something left hanging open behind it. */
document.querySelectorAll('a[href$=".html"]').forEach(link => {
  link.addEventListener('click', e => {
    if(e.metaKey || e.ctrlKey || e.shiftKey || link.target === '_blank') return;
    const url = link.getAttribute('href');
    if(workBox.dataset.collapsed === 'true'){          // nothing to close
      e.preventDefault();
      fadeCurtain(1).then(() => { window.location.href = url; });
      return;
    }
    e.preventDefault();
    toggleCollapsible(workBox, false);                 // bypasses the lock on purpose
    paintToggle(false);
    fadeCurtain(1).then(() => { window.location.href = url; });
  });
});

/* Wait for the manifest, then lift the curtain on finished content and open
   the Work section. Measuring an empty box would animate to the wrong height,
   so the section open waits too. */
load().then(() => {
  reveal();
  setTimeout(() => setWork(true), 250);
});

/* ---------- Email copy ----------
   Click: highlight with the same active pill the work filters use,
   swap the label to COPIED, then restore after two seconds. */
(function(){
  const btn = document.getElementById('copyEmail');
  if(!btn) return;
  const status = document.getElementById('copyStatus');
  const email = btn.dataset.email;
  let timer = null;

  async function copy(text){
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
        return true;
      }
      /* http:// and older browsers have no clipboard API */
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.cssText = 'position:absolute;left:-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }

  btn.addEventListener('click', async () => {
    const ok = await copy(email);
    clearTimeout(timer);
    if(ok){
      btn.classList.add('pill--active');
      btn.textContent = 'COPIED';
      if(status) status.textContent = email + ' copied to clipboard';
    }else{
      btn.textContent = email;          /* nothing copied — show it to select by hand */
      if(status) status.textContent = 'Copy failed. The address is ' + email;
    }
    timer = setTimeout(() => {
      btn.classList.remove('pill--active');
      btn.textContent = 'Email';
      if(status) status.textContent = '';
    }, 2000);
  });
})();




/* ---------- Page curtain ---------- */
const curtain = document.getElementById('curtain');

function fadeCurtain(to){
  if(!curtain) return Promise.resolve();
  if(!curtain.animate){                     // very old browser — no fade
    curtain.style.opacity = String(to);
    return Promise.resolve();
  }
  const from = to === 0 ? 1 : 0;
  curtain.style.opacity = String(from);
  const a = curtain.animate([{opacity:from},{opacity:to}], MOTION);
  a.onfinish = () => { curtain.style.opacity = String(to); };
  return a.finished.catch(() => {});
}

/* Reveal on arrival — but only once the tiles exist. The manifest is fetched,
   so lifting the curtain straight away uncovers an empty column and the work
   then pops in behind it. reveal() is called from load(), below. */
function reveal(){ fadeCurtain(0); }
window.addEventListener('pageshow', e => { if(e.persisted) fadeCurtain(0); });
/* if anything goes wrong, never leave the content hidden */
setTimeout(() => { if(curtain && curtain.style.opacity !== '0') curtain.style.opacity = '0'; }, 2000);

</script>
